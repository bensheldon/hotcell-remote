AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics:
  Enabled: false

Layout/LineLength:
  Max: 170

Naming/FileName:
  Exclude:
    - lib/hotcell-remote.rb

Naming/MemoizedInstanceVariableName:
  EnforcedStyleForLeadingUnderscores: required
